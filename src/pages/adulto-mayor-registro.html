<!-- 
  PANTALLA: Registro del Adulto Mayor
  Formulario de registro con validaciones accesibles
-->
<div id="adulto-mayor-registro" class="page-container hidden">
  <div class="page-header">
    <img 
      src="assets/images/colibri-logo.png" 
      alt="Colibrí PulseVision" 
      class="page-header-logo"
    />
    <h1 class="page-title">Registro</h1>
    <p class="page-subtitle">Completa tus datos para comenzar</p>
  </div>

  <form id="registro-form" class="registro-form">
<!-- Correo electrónico -->
<div class="form-group">
  <label for="email" class="form-label">Correo electrónico *</label>
  <input 
    type="email" 
    id="email" 
    name="email" 
    class="form-input" 
    placeholder="ejemplo@gmail.com"
    required
    aria-required="true"
  />
  <span class="form-error" id="error-email"></span>
</div>

<!-- Contraseña -->
<div class="form-group">
  <label for="password" class="form-label">Contraseña *</label>
  <input 
    type="password" 
    id="password" 
    name="password" 
    class="form-input" 
    placeholder="Mínimo 6 caracteres"
    minlength="6"
    required
    aria-required="true"
  />
  <span class="form-error" id="error-password"></span>
</div>

<!-- Confirmar contraseña -->
<div class="form-group">
  <label for="confirm-password" class="form-label">Confirmar contraseña *</label>
  <input 
    type="password" 
    id="confirm-password" 
    name="confirmPassword" 
    class="form-input" 
    placeholder="Repite tu contraseña"
    required
    aria-required="true"
  />
  <span class="form-error" id="error-confirm-password"></span>
</div>
    <!-- Nombre -->
    <div class="form-group">
      <label for="nombre" class="form-label">Nombre completo *</label>
      <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        class="form-input" 
        placeholder="Ingresa tu nombre"
        required
        aria-required="true"
      />
      <span class="form-error" id="error-nombre"></span>
    </div>

    <!-- Edad -->
    <div class="form-group">
      <label for="edad" class="form-label">Edad *</label>
      <input 
        type="number" 
        id="edad" 
        name="edad" 
        class="form-input" 
        placeholder="Tu edad"
        min="60"
        max="120"
        required
        aria-required="true"
      />
      <span class="form-error" id="error-edad"></span>
    </div>

    <!-- Teléfono de emergencia -->
    <div class="form-group">
      <label for="telefono" class="form-label">Teléfono de emergencia *</label>
      <input 
        type="tel" 
        id="telefono" 
        name="telefono" 
        class="form-input" 
        placeholder="Ej: 555-1234-5678"
        required
        aria-required="true"
      />
      <span class="form-help">Número de un familiar o contacto de confianza</span>
      <span class="form-error" id="error-telefono"></span>
    </div>

    <!-- Zona -->
    <div class="form-group">
      <label for="zona" class="form-label">Zona donde vives *</label>
      <select 
        id="zona" 
        name="zona" 
        class="form-input form-select"
        required
        aria-required="true"
      >
        <option value="">Selecciona tu zona</option>
        <option value="norte">Zona Norte</option>
        <option value="sur">Zona Sur</option>
        <option value="este">Zona Este</option>
        <option value="oeste">Zona Oeste</option>
        <option value="centro">Centro</option>
      </select>
      <span class="form-error" id="error-zona"></span>
    </div>

    <!-- Necesidades principales -->
    <div class="form-group">
      <label class="form-label">Necesidades principales *</label>
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="compania" class="checkbox-input">
          <span class="checkbox-text">Compañía y conversación</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="medicamentos" class="checkbox-input">
          <span class="checkbox-text">Recordatorio de medicamentos</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="compras" class="checkbox-input">
          <span class="checkbox-text">Ayuda con compras</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="citas" class="checkbox-input">
          <span class="checkbox-text">Acompañamiento a citas médicas</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="tecnologia" class="checkbox-input">
          <span class="checkbox-text">Ayuda con tecnología</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="necesidades" value="otras" class="checkbox-input">
          <span class="checkbox-text">Otras necesidades</span>
        </label>
      </div>
      <span class="form-error" id="error-necesidades"></span>
    </div>

    <!-- Botón de envío -->
    <button type="submit" class="btn-primary btn-large">
      Completar registro
    </button>
  </form>
</div>
