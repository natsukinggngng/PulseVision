<!-- 
  PANTALLA: Chat del Adulto Mayor
  Chat sencillo con el voluntario asignado
-->
<div id="adulto-mayor-chat" class="page-container hidden">
  <div class="chat-header">
    <h1 class="page-title">Chat</h1>
    <div id="chat-voluntario-info" class="voluntario-info">
      <!-- Se llenará dinámicamente si hay voluntario asignado -->
    </div>
  </div>

  <div class="chat-container">
    <!-- Mensajes del chat -->
    <div id="chat-messages" class="chat-messages">
      <div class="chat-empty-state">
        <p>No tienes un acompañante asignado aún.</p>
        <p class="chat-empty-hint">Cuando se asigne un voluntario, podrás chatear aquí.</p>
      </div>
    </div>

    <!-- Input de mensaje (oculto si no hay voluntario) -->
    <div id="chat-input-container" class="chat-input-container hidden">
      <input 
        type="text" 
        id="chat-input" 
        class="chat-input" 
        placeholder="Escribe un mensaje..."
        aria-label="Escribe un mensaje"
      />
      <button id="chat-send-btn" class="chat-send-btn" aria-label="Enviar mensaje">
        ➤
      </button>
    </div>
  </div>

  <!-- Barra de navegación inferior -->
  <div id="bottom-nav-container-chat"></div>
</div>
