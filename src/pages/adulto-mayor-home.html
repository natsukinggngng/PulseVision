<!-- 
  PANTALLA: Home del Adulto Mayor
  Pantalla principal con opciones de ayuda y botón principal
-->
<div id="adulto-mayor-home" class="page-container hidden">
  <!-- Colibrí guía emocional en la parte superior -->
  <div id="colibri-guide-wrapper" class="colibri-guide-wrapper colibri-top"></div>

  <div class="page-content">
    <div class="home-header">
      <h1 class="home-title">¿Qué tipo de ayuda necesitas?</h1>
    </div>

    <!-- Tipos de ayuda disponibles -->
    <div class="help-types">
      <button class="help-type-btn" data-help="compania">
        <span class="help-icon"></span>
        <span class="help-label">Compañía</span>
      </button>
      
      <button class="help-type-btn" data-help="medicamentos">
        <span class="help-icon"></span>
        <span class="help-label">Medicamentos</span>
      </button>
      
      <button class="help-type-btn" data-help="compras">
        <span class="help-icon"></span>
        <span class="help-label">Compras</span>
      </button>
      
      <button class="help-type-btn" data-help="citas">
        <span class="help-icon"></span>
        <span class="help-label">Citas médicas</span>
      </button>
      
      <button class="help-type-btn" data-help="tecnologia">
        <span class="help-icon"></span>
        <span class="help-label">Tecnología</span>
      </button>
      
      <button class="help-type-btn" data-help="otras">
        <span class="help-icon"></span>
        <span class="help-label">Otras</span>
      </button>
    </div>

    <!-- Botón principal de ayuda -->
    <div class="main-action">
      <button id="pedir-ayuda-btn" class="btn-primary btn-large btn-coral">
        Pedir ayuda ahora
      </button>
    </div>

    <!-- Sección de solicitudes activas (si las hay) -->
    <div id="solicitudes-activas" class="solicitudes-section hidden">
      <h2 class="section-title">Tus solicitudes activas</h2>
      <div id="solicitudes-list" class="solicitudes-list">
        <!-- Se llenará dinámicamente -->
      </div>
    </div>
  </div>

  <!-- Barra de navegación inferior -->
  <div id="bottom-nav-container"></div>
</div>
