<!-- 
  PANTALLA: Perfil del Adulto Mayor
  Información del perfil, edición y gestión del acompañante
-->
<div id="adulto-mayor-perfil" class="page-container hidden">
  <div class="page-header">
    <h1 class="page-title">Mi Perfil</h1>
  </div>

  <div class="perfil-container">
    <!-- Información personal -->
    <section class="perfil-section">
      <h2 class="section-title">Información personal</h2>
      <div class="perfil-info">
        <div class="info-item">
          <span class="info-label">Nombre:</span>
          <span class="info-value" id="perfil-nombre">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Edad:</span>
          <span class="info-value" id="perfil-edad">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Zona:</span>
          <span class="info-value" id="perfil-zona">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">Teléfono de emergencia:</span>
          <span class="info-value" id="perfil-telefono">-</span>
        </div>
      </div>
      <button id="editar-perfil-btn" class="btn-secondary">
         Editar información
      </button>
    </section>

    <!-- Acompañante actual -->
    <section class="perfil-section" id="acompanante-section">
      <h2 class="section-title">Mi acompañante</h2>
      <div id="acompanante-info" class="acompanante-card">
        <div class="acompanante-empty">
          <p>No tienes un acompañante asignado</p>
          <p class="acompanante-hint">Solicita ayuda para que se te asigne un voluntario</p>
        </div>
      </div>
      <div id="acompanante-actions" class="acompanante-actions hidden">
        <button id="cambiar-acompanante-btn" class="btn-secondary">
           Cambiar acompañante
        </button>
        <button id="anular-acompanante-btn" class="btn-secondary btn-danger">
           Anular acompañante
        </button>
      </div>
    </section>

    <!-- Calificación del voluntario -->
    <section class="perfil-section" id="calificacion-section">
      <h2 class="section-title">Calificar acompañante</h2>
      <div id="calificacion-form" class="calificacion-form hidden">
        <div class="stars-rating">
          <button class="star-btn" data-rating="1"></button>
          <button class="star-btn" data-rating="2"></button>
          <button class="star-btn" data-rating="3"></button>
          <button class="star-btn" data-rating="4"></button>
          <button class="star-btn" data-rating="5"></button>
        </div>
        <textarea 
          id="calificacion-comentario" 
          class="form-textarea" 
          placeholder="Comentario opcional..."
          rows="3"
        ></textarea>
        <button id="enviar-calificacion-btn" class="btn-primary">
          Enviar calificación
        </button>
      </div>
      <div id="calificacion-empty" class="calificacion-empty">
        <p>Califica a tu acompañante cuando hayas tenido una experiencia con él/ella</p>
      </div>
    </section>
  </div>

  <!-- Barra de navegación inferior -->
  <div id="bottom-nav-container-perfil"></div>
</div>
